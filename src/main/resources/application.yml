server:
  port: ${PORT:8080}

spring:
  ai:
    mcp:
      server:
        name: mcp-stack-de-mama
        version: 0.1.0
        protocol: STATELESS   # sin sesion entre llamadas: cada tool call es independiente. Correcto para un bot de Telegram sin estado conversacional persistido en el MCP.
      client:
        type: SYNC
        streamable-http:
          connections:
            # El bot de Telegram vive en el mismo proceso que expone /mcp: se conecta a si mismo
            # por loopback, tratandose como un cliente MCP mas (protocolo real, no llamadas directas
            # a los @McpTool). Requiere que el propio server ya este arriba - ver McpServerApplication.
            self:
              url: http://localhost:${server.port}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5}

app:
  security:
    bearer-token: ${MCP_SERVER_BEARER_TOKEN:change-me}
  services:
    logistica-base-url: ${LOGISTICA_BASE_URL:http://localhost:9001}
    donaciones-base-url: ${DONACIONES_BASE_URL:http://localhost:9002}
    donadores-entidades-base-url: ${DONADORES_ENTIDADES_BASE_URL:http://localhost:9004}
    incentivos-base-url: ${INCENTIVOS_BASE_URL:http://localhost:9003}
  http:
    connect-timeout: ${HTTP_CONNECT_TIMEOUT:10s}
    read-timeout: ${HTTP_READ_TIMEOUT:60s}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME:Grupo8_DSI_bot}

management:
  endpoints:
    web:
      exposure:
        include: health